<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Alankara Kosha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="title">
    <h1><span class="dev" lang="sa">॥ अलङ्कारकोशः ॥</span><span class="lat">Alankara Kosha</span></h1>
    <div class="orn" aria-hidden="true">❖</div>
  </header>
  <nav class="tabs">
    <button type="button" data-view="search" aria-pressed="true">Search</button>
    <button type="button" data-view="coll" aria-pressed="false">Collection <span id="count"></span></button>
  </nav>
  <div id="search-view">
    <section class="seq-row">
      <output id="seq" aria-live="polite"></output>
      <button id="clear" type="button" aria-label="Clear sequence">✕</button>
    </section>
    <section id="keys" class="keys" aria-label="Swar"></section>
    <button id="random" type="button" class="random">Random</button>
    <section id="results" aria-live="polite"></section>
  </div>
  <div id="coll-view" hidden>
    <div id="coll-tools" class="coll-tools">
      <button id="print" type="button" class="random">Print</button>
      <button id="clear-all" type="button" class="ghost">Clear collection</button>
    </div>
    <ol id="coll-list"></ol>
  </div>
  <footer class="foot">
    <p>© 2026 <a href="https://github.com/tschmits" target="_blank" rel="noopener">Tijn Schmits</a> · <a href="https://github.com/tschmits/alankara-kosha" target="_blank" rel="noopener">Source on GitHub</a> · <a href="https://github.com/tschmits/alankara-kosha/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a></p>
    <p>♥️ With honourable thanks 🙏 to my guru <button id="guru" type="button" aria-expanded="false" aria-controls="guru-links">Jeevan Dhami</button> <em>(Fluting Is In Our D.N.A)</em> 🎶🪈</p>
    <ul id="guru-links" hidden>
      <li><a href="https://www.youtube.com/@flutedna" target="_blank" rel="noopener">YouTube</a></li>
      <li><a href="https://www.instagram.com/dhamijeevan/" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="https://www.facebook.com/flutingisinmyD.N.A" target="_blank" rel="noopener">Facebook page</a></li>
      <li><a href="https://www.facebook.com/flutist.jeevan.1" target="_blank" rel="noopener">Facebook</a></li>
      <li><a href="https://x.com/creativejeevan" target="_blank" rel="noopener">X</a></li>
      <li><a href="https://www.linkedin.com/in/jeevan-dhami-a6274a102" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
